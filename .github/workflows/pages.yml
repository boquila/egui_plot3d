name: Gallery on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: v0.21.14
      - uses: actions/configure-pages@v5
      - name: Build gallery
        working-directory: demo
        run: trunk build --release --locked --public-url "/${{ github.event.repository.name }}/"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the deployed URL layout in Chromium
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m playwright install --with-deps chromium
          mkdir -p "artifacts/pages-site/${{ github.event.repository.name }}"
          cp -r demo/dist/. "artifacts/pages-site/${{ github.event.repository.name }}/"
          python scripts/browser_smoke.py --serve-dir artifacts/pages-site --base-path "/${{ github.event.repository.name }}/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-browser-evidence
          path: |
            artifacts/*.png
            artifacts/browser-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
