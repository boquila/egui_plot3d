[package]
name = "egui_plot3d_demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
egui_plot3d = { path = ".." }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["syntect"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement"] }
