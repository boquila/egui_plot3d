<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ten interactive 3D plots for egui: explore waves, attractors, spherical harmonics, knots, and more with a familiar Rust API.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">
  <title>egui_plot3d</title>
  <link data-trunk rel="rust">
  <link data-trunk rel="icon" href="assets/favicon.svg">
  <base data-trunk-public-url>
  <style>
    html{touch-action:manipulation}
    html,body{margin:0!important;padding:0!important;width:100%;height:100%;overflow:hidden}
    body{background:#909090}
    @media(prefers-color-scheme:dark){body{background:#404040}}
    canvas{display:block;position:absolute;top:0;left:0;margin-left:auto;margin-right:auto;width:100%;height:100%;touch-action:none}
    #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f0f0f0;font:24px Ubuntu-Light,Helvetica,sans-serif;text-align:center;pointer-events:none}
    #loading p{font-size:16px}
    .lds-dual-ring{display:inline-block;width:24px;height:24px}
    .lds-dual-ring:after{content:" ";display:block;width:24px;height:24px;border-radius:50%;border:3px solid #fff;border-color:#fff transparent #fff transparent;animation:lds-dual-ring 1.2s linear infinite}
    @keyframes lds-dual-ring{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    noscript{position:absolute;inset:30% 10%;text-align:center}
  </style>
</head>
<body>
  <canvas id="plot_canvas" aria-label="Interactive 3D plotting gallery"></canvas>
  <div id="loading" role="status"><p>Loading…</p><div class="lds-dual-ring"></div></div>
  <noscript>This interactive Rust/WebAssembly gallery requires JavaScript and WebGL.</noscript>
</body>
</html>
